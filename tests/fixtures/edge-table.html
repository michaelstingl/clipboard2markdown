<html><body>
<h2>Tabelle mit echtem thead</h2>
<table>
  <thead>
    <tr><th>Spalte A</th><th>Spalte B</th></tr>
  </thead>
  <tbody>
    <tr><td>a1</td><td>b1</td></tr>
    <tr><td>a2</td><td>b2</td></tr>
  </tbody>
</table>

<h2>Tabelle mit TH in erster Zeile (ohne thead)</h2>
<table>
  <tr><th>X</th><th>Y</th></tr>
  <tr><td>1</td><td>2</td></tr>
</table>

<h2>Tabelle mit Alignment</h2>
<table>
  <thead>
    <tr><th align="left">Links</th><th align="center">Mitte</th><th align="right">Rechts</th></tr>
  </thead>
  <tbody>
    <tr><td>a</td><td>b</td><td>c</td></tr>
  </tbody>
</table>

<h2>Tabelle mit colspan</h2>
<table>
  <tr><th>A</th><th>B</th><th>C</th></tr>
  <tr><td colspan="2">Zwei Zellen breit</td><td>Dritte</td></tr>
  <tr><td>a</td><td>b</td><td>c</td></tr>
</table>

<h2>Tabelle mit Zellen-Pipes</h2>
<table>
  <tr><th>Name</th><th>Wert</th></tr>
  <tr><td>a | b</td><td>c | d</td></tr>
</table>
</body></html>
